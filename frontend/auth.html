<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Analysis Platform - Auth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #4a1a4a 50%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .card {
      background: #2d2d3d;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 40px;
      border: 2px solid #8b5cf6;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .icon-wrapper {
      display: inline-block;
      padding: 20px;
      background: #8b5cf6;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .icon {
      width: 48px;
      height: 48px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    h1 {
      color: white;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 2px solid #4b5563;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    input.error {
      border-color: #ef4444;
    }

    .error-message {
      color: #fca5a5;
      font-size: 12px;
      margin-top: 6px;
    }

    .alert {
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #86efac;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover:not(:disabled) {
      background: #7c3aed;
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #a78bfa;
      cursor: not-allowed;
    }

    .switch-mode {
      text-align: center;
      margin-top: 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .switch-link {
      color: #a78bfa;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }

    .switch-link:hover {
      color: #c4b5fd;
    }

    .backend-info {
      text-align: center;
      margin-top: 16px;
      color: #6b7280;
      font-size: 11px;
    }

    .hidden {
      display: none;
    }

    /* Dashboard Styles */
    .dashboard {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .dashboard h2 {
      color: white;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #374151;
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #9ca3af;
    }

    .profile-value {
      color: white;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    .status-active {
      color: #10b981;
      font-weight: 600;
    }

    .btn-logout {
      background: #ef4444;
    }

    .btn-logout:hover:not(:disabled) {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth View -->
    <div id="authView" class="card">
      <div class="header">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <h1 id="authTitle">Welcome Back</h1>
        <p class="subtitle" id="authSubtitle">Login to your code analysis platform</p>
      </div>

      <div id="successAlert" class="alert alert-success hidden"></div>
      <div id="errorAlert" class="alert alert-error hidden"></div>

      <div id="nameGroup" class="form-group hidden">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="">
        <div id="nameError" class="error-message hidden"></div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="">
        <div id="emailError" class="error-message hidden"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="">
        <div id="passwordError" class="error-message hidden"></div>
      </div>

      <button id="submitBtn" class="btn">Login</button>

      <div class="switch-mode">
        <span id="switchText">Don't have an account?</span>
        <a class="switch-link" id="switchLink">Sign up</a>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="card hidden">
      <div class="header">
        <div class="icon-wrapper">
          <svg class="icon" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <h1>Code Analysis Platform</h1>
        <p class="subtitle">Welcome to your dashboard</p>
      </div>

      <div class="dashboard">
        <h2>Your Profile</h2>
        <div class="profile-item">
          <span class="profile-label">Email:</span>
          <span class="profile-value" id="userEmail"></span>
        </div>
        <div class="profile-item">
          <span class="profile-label">User ID:</span>
          <span class="profile-value" id="userId"></span>
        </div>
        <div class="profile-item">
          <span class="profile-label">Status:</span>
          <span class="profile-value status-active">● Active</span>
        </div>
      </div>

      <button id="logoutBtn" class="btn btn-logout">Logout</button>
    </div>

    <div class="backend-info">
      Backend: localhost:5000 | JWT Auth
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/auth';
    let isLogin = true;

    // Elements
    const authView = document.getElementById('authView');
    const dashboardView = document.getElementById('dashboardView');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');
    const successAlert = document.getElementById('successAlert');
    const errorAlert = document.getElementById('errorAlert');
    const logoutBtn = document.getElementById('logoutBtn');

    // Error elements
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // Check if user is already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (token) {
        showDashboard();
      }
    });

    // Switch between login and signup
    switchLink.addEventListener('click', () => {
      isLogin = !isLogin;
      clearForm();
      updateUI();
    });

    function updateUI() {
      if (isLogin) {
        authTitle.textContent = 'Welcome Back';
        authSubtitle.textContent = 'Login to your code analysis platform';
        nameGroup.classList.add('hidden');
        submitBtn.textContent = 'Login';
        switchText.textContent = "Don't have an account?";
        switchLink.textContent = 'Sign up';
      } else {
        authTitle.textContent = 'Create Account';
        authSubtitle.textContent = 'Join our code analysis platform';
        nameGroup.classList.remove('hidden');
        submitBtn.textContent = 'Create Account';
        switchText.textContent = 'Already have an account?';
        switchLink.textContent = 'Login';
      }
    }

    function clearForm() {
      nameInput.value = '';
      emailInput.value = '';
      passwordInput.value = '';
      clearErrors();
      hideAlerts();
    }

    function clearErrors() {
      nameInput.classList.remove('error');
      emailInput.classList.remove('error');
      passwordInput.classList.remove('error');
      nameError.classList.add('hidden');
      emailError.classList.add('hidden');
      passwordError.classList.add('hidden');
    }

    function hideAlerts() {
      successAlert.classList.add('hidden');
      errorAlert.classList.add('hidden');
    }

    function showSuccess(message) {
      hideAlerts();
      successAlert.textContent = message;
      successAlert.classList.remove('hidden');
    }

    function showError(message) {
      hideAlerts();
      errorAlert.textContent = message;
      errorAlert.classList.remove('hidden');
    }

    function validateForm() {
      clearErrors();
      let isValid = true;

      if (!isLogin && !nameInput.value.trim()) {
        nameError.textContent = 'Name is required';
        nameError.classList.remove('hidden');
        nameInput.classList.add('error');
        isValid = false;
      }

      if (!emailInput.value.trim()) {
        emailError.textContent = 'Email is required';
        emailError.classList.remove('hidden');
        emailInput.classList.add('error');
        isValid = false;
      } else if (!/\S+@\S+\.\S+/.test(emailInput.value)) {
        emailError.textContent = 'Invalid email format';
        emailError.classList.remove('hidden');
        emailInput.classList.add('error');
        isValid = false;
      }

      if (!passwordInput.value) {
        passwordError.textContent = 'Password is required';
        passwordError.classList.remove('hidden');
        passwordInput.classList.add('error');
        isValid = false;
      } else if (passwordInput.value.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters';
        passwordError.classList.remove('hidden');
        passwordInput.classList.add('error');
        isValid = false;
      }

      return isValid;
    }

    // Submit form
    submitBtn.addEventListener('click', async () => {
      if (!validateForm()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = isLogin ? 'Logging in...' : 'Creating account...';
      hideAlerts();

      try {
        const endpoint = isLogin ? `${API_URL}/login` : `${API_URL}/signup`;
        const body = isLogin 
          ? { email: emailInput.value, password: passwordInput.value }
          : { name: nameInput.value, email: emailInput.value, password: passwordInput.value };

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (response.ok) {
          if (isLogin) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('userId', data.userId);
            localStorage.setItem('email', emailInput.value);
            showSuccess('Login successful! Welcome back.');
            setTimeout(() => showDashboard(), 1000);
          } else {
            showSuccess('Account created successfully! You can now login.');
            setTimeout(() => {
              isLogin = true;
              updateUI();
              clearForm();
            }, 2000);
          }
        } else {
          showError(data.message || 'Operation failed');
        }
      } catch (error) {
        showError('Network error. Please check if backend is running on port 5000.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLogin ? 'Login' : 'Create Account';
      }
    });

    // Show dashboard
    function showDashboard() {
      const email = localStorage.getItem('email');
      const userId = localStorage.getItem('userId');
      
      document.getElementById('userEmail').textContent = email;
      document.getElementById('userId').textContent = userId;
      
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
    }

    // Logout
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      localStorage.removeItem('email');
      
      dashboardView.classList.add('hidden');
      authView.classList.remove('hidden');
      clearForm();
      showSuccess('Logged out successfully');
    });

    // Allow Enter key to submit
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !dashboardView.classList.contains('hidden') === false) {
        submitBtn.click();
      }
    });
  </script>
</body>
</html>
